name: TracePilot E2E Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    name: Run E2E Tests (${{ matrix.project }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, 'Mobile Chrome']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          cd app
          npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test -- --project="${{ matrix.project }}"
        env:
          CI: true
          BASE_URL: http://localhost:5173

      - name: Upload Playwright Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  deploy-report:
    name: Deploy HTML Report to GitHub Pages
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Consolidate reports for deployment
        run: |
          mkdir -p public
          # Pick the chromium report as primary or merge if available
          if [ -d "all-reports/playwright-report-chromium" ]; then
            cp -r all-reports/playwright-report-chromium/* public/
          else
            cp -r all-reports/*/* public/ 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
